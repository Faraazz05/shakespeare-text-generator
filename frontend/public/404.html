<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>HybridGen</title>
    <script>
      var repo = '/shakespeare-text-generator';
      var path = window.location.pathname;
      if (path.startsWith(repo)) {
        sessionStorage.setItem('ghpages_redirect', path.slice(repo.length) || '/');
        window.location.replace(repo + '/');
      }
    </script>
  </head>
  <body></body>
</html>
